# Application Name
spring.application.name=ecommerce

# Server Port
server.port=${PORT:8080}

# MySQL Database Configuration
# Defaults to your local MySQL database (ecommerce_db / root / rootroot).
# In production (Render, Docker, Aiven), override using environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Authentication
# Supports JWT_SECRET or APP_JWT_SECRET environment variable, with a safe fallback for local runs
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600