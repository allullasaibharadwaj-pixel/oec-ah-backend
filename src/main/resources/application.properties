# Application Name
spring.application.name=ecommerce

# Server Port
server.port=${PORT:8080}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-2ce1ef49-allullasaibharadwaj-9730.b.aivencloud.com:13355/onlineecommerce?ssl-mode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Authentication
app.jwt.secret=${JWT_SECRET:${APP_JWT_SECRET:change-this-secret-key-to-a-long-random-string-of-at-least-64-characters-0123456789}}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600