# ===== Server =====
server.port=8080

# ===== MySQL (CHANGE USERNAME / PASSWORD HERE) =====
spring.datasource.url=jdbc:mysql://mysql-2ce1ef49-allullasaibharadwaj-9730.b.aivencloud.com:13355/onlineecommerce?ssl-mode=REQUIRED
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootroot}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== JWT =====
# Secret must be at least 64 characters. Change it for any real deployment.
app.jwt.secret=change-this-secret-key-to-a-long-random-string-of-at-least-64-characters-0123456789
# Token lifetime: 24 hours
app.jwt.expiration-ms=86400000

# ===== Serve the frontend folder directly from Spring Boot (http://localhost:8080/index.html) =====
spring.web.resources.static-locations=file:../frontend/,file:./frontend/,classpath:/static/
spring.web.resources.cache.period=0
