# Application Name
spring.application.name=ecommerce

# Server Port
server.port=${PORT:8080}

# MySQL Database Configuration
# Defaults to your local MySQL database (ecommerce_db / root / rootroot).
# In production (Render, Docker, Aiven), override using environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootroot}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Authentication
# Supports JWT_SECRET or APP_JWT_SECRET environment variable, with a safe fallback for local runs
app.jwt.secret=${JWT_SECRET:${APP_JWT_SECRET:change-this-secret-key-to-a-long-random-string-of-at-least-64-characters-0123456789}}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Static Resources
spring.web.resources.static-locations=file:../frontend/,file:./frontend/,classpath:/static/
spring.web.resources.cache.period=3600